version: '3.8'

services:
  web:
    build: .
    container_name: xampp_web
    ports:
      - "8080:80"   # Maps host port 8080 to container's Apache port 80
    volumes:
      - ./src:/var/www/html  # Mounts your local PHP files into the container
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: xampp_db
    environment:
      MYSQL_ROOT_PASSWORD: 123456789
      MYSQL_DATABASE: my_database
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: 123456789
    ports:
      - "3306:3306" # Maps host port 3306 to container's MySQL port 3306
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: xampp_phpmyadmin
    ports:
      - "8081:80"   # Maps host port 8081 to container's phpMyAdmin port 80
    environment:
      PMA_HOST: db   # Connects phpMyAdmin to the 'db' service
    depends_on:
      - db

volumes:
  db_data: